<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>现代红警 Modern Red Alert</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ff5545'/></svg>">
<link rel="stylesheet" href="css/style.css">
<script>
// 错误采集器：异常写入 #errlog 和标题（便于无头验证与调试）
window.__errors = [];
function logErr(msg) {
  window.__errors.push(String(msg));
  const el = document.getElementById('errlog');
  if (el) el.textContent = window.__errors.join('\n');
  if (!document.title.startsWith('ERR')) document.title = 'ERR ' + document.title;
}
window.addEventListener('error', e => logErr(e.message + ' @' + (e.filename || '') + ':' + (e.lineno || '')));
window.addEventListener('unhandledrejection', e => logErr('unhandled: ' + (e.reason?.stack || e.reason)));
// 可见错误提示条：任何脚本异常都不静默（游戏循环内部会自行拦截继续运行）
window.addEventListener('error', () => {
  const tip = document.getElementById('fatalTip');
  if (tip && window.__errors.length) tip.style.display = 'block';
});
</script>
</head>
<body>
  <!-- 开始界面（选难度 + 解锁音频） -->
  <div id="start">
    <div class="start-card">
      <div class="start-crest"></div>
      <div class="start-title">现代红警</div>
      <div class="start-sub">MODERN RED ALERT · 即时战略遭遇战</div>
      <div class="start-desc">采矿经济 · 基地建造 · 战争迷雾 · AI 指挥官</div>
      <div class="diff-label">选择 AI 难度</div>
      <div class="diff-row">
        <button class="diff-btn" data-diff="easy">简单<small>敌方经济迟缓</small></button>
        <button class="diff-btn active" data-diff="normal">普通<small>旗鼓相当</small></button>
        <button class="diff-btn" data-diff="hard">困难<small>坦克海攻势</small></button>
      </div>
      <button id="startBtn">开 始 行 动</button>
      <div class="start-keys">左键框选 · 右键移动/攻击 · <b>A</b> 攻击移动 · <b>R</b> 巡逻 · <b>G</b> 固守/警戒 · <b>Shift</b> 排队指令</div>
      <div class="start-keys">1-9 编队 · 空格警报 · <b>F</b> 空闲部队 · <b>D</b> 展开 · <b>B/N/C/K</b> 建造页 · P 暂停 · 中键拖屏</div>
    </div>
  </div>

  <div id="topbar">
    <span class="brand">现代红警</span>
    <span id="credits" class="stat">0</span>
    <div id="powerWrap" title="电力：需求/供给">
      <svg width="11" height="14" viewBox="0 0 11 14" style="flex:none"><path d="M6.5 0 0 8h3.5L3 14l7-8.5H6z" fill="#ffc94d"/></svg>
      <div id="powerBar"><div id="powerFill"></div></div>
      <span id="power">0/0</span>
    </div>
    <span id="msg"></span>
    <span id="gameState" class="badge"></span>
    <span id="diffBadge" class="badge diff"></span>
    <button id="gearBtn" title="音频设置">⚙</button>
    <div id="settings" class="hidden">
      <div class="set-row"><span>音效</span><input id="sfxVol" type="range" min="0" max="100" value="80"></div>
      <div class="set-row"><span>音乐</span><input id="musVol" type="range" min="0" max="100" value="50"></div>
      <div class="set-row"><label><input id="muteChk" type="checkbox"> 静音（M）</label></div>
    </div>
  </div>

  <div id="main">
    <div id="canvasWrap">
      <canvas id="game"></canvas>
      <div id="selbox"></div>
      <div id="vignette"></div>
      <div id="alarmGlow"></div>
      <div id="lowPowerGlow"></div>
      <div id="superFlash"></div>
      <div id="alertBanner">⚠ 遭到攻击</div>
    </div>
    <div id="sidebar">
      <div id="tabs">
        <button class="tab active" data-tab="buildings">建筑</button>
        <button class="tab" data-tab="infantry">步兵</button>
        <button class="tab" data-tab="vehicles">载具</button>
        <button class="tab" data-tab="tech">科技</button>
      </div>
      <div id="buildgrid"></div>
      <div id="superWrap" class="hidden">
        <button id="superBtn" title="轨道动能炮（V）：全图打击，大范围毁灭伤害">
          <span class="sw-icon">◉</span> 轨道动能炮 <span id="superCd">就绪</span>
        </button>
      </div>
      <div id="minimapWrap"><canvas id="minimap" width="192" height="192"></canvas></div>
      <div id="selinfo"></div>
    </div>
  </div>

  <div id="tooltip" class="hidden"></div>

  <div id="overlay" class="hidden">
    <div id="overlayText"></div>
    <div id="statsGrid"></div>
    <button id="restartBtn">再来一局</button>
  </div>
  <div id="fatalTip" style="display:none"></div>
  <div id="errlog"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
